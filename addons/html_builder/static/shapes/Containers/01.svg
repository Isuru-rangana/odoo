<svg xmlns="http://www.w3.org/2000/svg" fill="#383E45"><style>.preview{display:none}@media only screen and (max-width:130px) and (max-height:55px){.shape{display:none}.preview{display:block}}</style><defs><mask id="mask"><rect width="100%" height="100%" fill="#fff"/><rect width="66%" height="calc(100% - 48px)" x="24" y="24" fill="#000" rx="32"/></mask><mask id="mask_preview"><rect width="100%" height="100%" fill="#fff"/><rect width="66%" height="calc(100% - 12px)" x="6" y="6" fill="#000" rx="4"/></mask></defs><rect width="100%" height="100%" class="shape" mask="url(#mask)"/><rect width="100%" height="100%" class="preview" mask="url(#mask_preview)"/></svg>